name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: RSpec + RuboCop
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sinatra_boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: sinatra_boilerplate_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ci_only_jwt_secret_replace_in_production_8a3f5d9b2c1e7f4a6d8c0b9e3f2a1d5c
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TTL: "3600"
      JWT_REFRESH_TTL: "2592000"
      CORS_ALLOWED_ORIGINS: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Run database migrations
        run: bundle exec rake db:migrate

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop --no-fail-level=convention
        continue-on-error: true

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target prod -t sinatra-boilerplate:test .

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint ruby sinatra-boilerplate:test -e "require_relative 'config/environment'; puts 'OK'"