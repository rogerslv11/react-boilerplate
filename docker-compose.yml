name: sinatra-boilerplate

services:
  app:
    build:
      context: .
      target: dev
    container_name: sinatra-boilerplate-app
    command: bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:4567
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "4567:4567"
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "4567"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: sinatra_boilerplate_dev
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-development_only_change_me_in_production}
      JWT_ACCESS_TTL: "3600"
      JWT_REFRESH_TTL: "2592000"
      CORS_ALLOWED_ORIGINS: "*"
      RATE_LIMIT: "100"
      RATE_PERIOD: "60"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sinatra-boilerplate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sinatra_boilerplate_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net
    restart: unless-stopped

volumes:
  postgres-data:
  bundle:

networks:
  app-net:
    driver: bridge