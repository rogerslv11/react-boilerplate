name: nestjs-boilerplate

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestjs-boilerplate:latest
    container_name: nestjs-boilerplate-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@postgres:5432/app_db?schema=public
      LOG_PRETTY: "false"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: nestjs-boilerplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # exposed only for local development; comment out to keep DB private
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d app_db
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
