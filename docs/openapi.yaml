openapi: 3.1.0
info:
  title: Sinatra Boilerplate API
  version: 1.0.0
  description: |
    Professional REST API boilerplate built with Ruby, Sinatra, ActiveRecord
    and PostgreSQL. Provides authentication (JWT + refresh tokens), full
    CRUD on users, health checks, structured logging, rate limiting, and
    CORS support.

    Source: https://github.com/anomalyco/opencode
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT

servers:
  - url: http://localhost:4567
    description: Local development server

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: User management (admin-only writes)
  - name: Example
    description: Sample module showing the canonical extension shape

paths:
  /:
    get:
      summary: Service banner
      tags: [Health]
      responses:
        '200':
          description: Application banner
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: string }
                      environment: { type: string }
                      docs: { type: string }
                      api: { type: string }

  /health:
    get:
      summary: Detailed health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: One or more dependencies are down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }

  /health/live:
    get:
      summary: Liveness probe (always 200 if process responds)
      tags: [Health]
      responses:
        '200':
          description: Process is alive

  /health/ready:
    get:
      summary: Readiness probe (checks DB connection)
      tags: [Health]
      responses:
        '200':
          description: Process is ready to serve traffic
        '503':
          description: Process is not ready

  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created, returns token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409':
          description: Email already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

  /api/v1/auth/login:
    post:
      summary: Authenticate and obtain a token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Refresh token is invalid or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token revoked

  /api/v1/auth/logout-all:
    post:
      summary: Revoke every refresh token for the authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All refresh tokens revoked
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/me:
    get:
      summary: Get the currently authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/users:
    get:
      summary: List users (admin only)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search over name and email
        - in: query
          name: role
          schema: { type: string, enum: [user, admin] }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: sort
          schema: { type: string, enum: [name, email, created_at, updated_at] }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      summary: Create a new user (admin only)
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

  /api/v1/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }

    get:
      summary: Show a user (self or admin)
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    patch:
      summary: Update a user (self for personal fields, admin for everything)
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403':
          description: Authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

    delete:
      summary: Soft-delete a user (admin only)
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted
        '403':
          description: Authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/example/echo:
    get:
      summary: Echoes the supplied message
      tags: [Example]
      parameters:
        - in: query
          name: message
          schema: { type: string }
      responses:
        '200':
          description: Echoed message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }

    post:
      summary: Echoes a validated message from JSON body
      tags: [Example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Echoed message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    HealthReport:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        environment: { type: string }
        uptime_seconds: { type: integer }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, down] }
            redis: { type: string, enum: [ok, down] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 8, maxLength: 128 }

    CreateUserRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
          properties:
            role:
              type: string
              enum: [user, admin]

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role:
          type: string
          enum: [user, admin]
        active: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }

    UserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    TokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, description: "Seconds until access_token expires" }
            user: { $ref: '#/components/schemas/User' }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string, nullable: true }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string, nullable: true }